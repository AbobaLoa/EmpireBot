<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>E4K Attacks</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #12141c;
      --card: #1c2130;
      --gold: #e4c27a;
      --muted: #9aa3b5;
      --ok: #7dce9a;
      --warn: #e08b4f;
      --bad: #e25b5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #2a2233, var(--bg) 55%);
      color: #f3f4f8;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 12px; color: var(--gold); }
    .card {
      background: var(--card);
      border: 1px solid #3a4158;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .coords { font-size: 22px; font-weight: 700; }
    .muted { color: var(--muted); font-size: 13px; }
    .shot {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
      background: #0b0d14;
      min-height: 140px;
      object-fit: cover;
    }
    .row { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .pill {
      background: #101522;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .march {
      border-top: 1px solid #31384c;
      padding-top: 8px;
      margin-top: 8px;
      font-size: 13px;
    }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .on { background: #2f6b45; }
    .off { background: #8a3030; }
    label { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); }
    input, select {
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #3a4158;
      background: #101522;
      color: #f3f4f8;
    }
    .save { background: #3d4a2f; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Empire Four Kingdoms</h1>
  <div class="card">
    <div class="muted" id="status">загрузка…</div>
    <div class="coords" id="coords">—</div>
    <div class="row">
      <div class="pill">КД атаки: <span id="cd">—</span></div>
      <div class="pill">В пути: <span id="inflight">0</span>/30</div>
    </div>
    <img class="shot" id="shot" alt="Скрин замка" />
  </div>
  <div class="card">
    <button id="toggle" class="off" type="button">ВЫКЛ</button>
    <div class="muted" id="hotkeyHint" style="margin-top:8px">Клавиша N сразу отпускает мышь</div>
    <label>Цель
      <select id="kind">
        <option value="baron">Разбойники</option>
        <option value="nomad">Кочевники</option>
        <option value="shogun">Сёгун</option>
      </select>
    </label>
    <label>Горячая клавиша
      <input id="hotkey" maxlength="3" placeholder="N" />
    </label>
    <label>Макс. атак в пути
      <input id="maxConcurrent" type="number" min="1" max="30" />
    </label>
    <label>Пауза между атаками, сек
      <div class="row">
        <input id="delayMin" type="number" min="1" max="60" />
        <input id="delayMax" type="number" min="1" max="60" />
      </div>
    </label>
    <label><input id="dryRun" type="checkbox" style="width:auto" /> DRY-RUN</label>
    <label><input id="feathers" type="checkbox" style="width:auto" /> Перья</label>
    <button class="save" id="save" type="button">Сохранить настройки</button>
  </div>
  <div class="card">
    <div class="muted">Военачальники в походе</div>
    <div id="marches"></div>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    function fmt(sec) {
      sec = Math.max(0, Number(sec) || 0);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if (m >= 60) {
        const h = Math.floor(m / 60);
        return h + " ч " + (m % 60) + " мин";
      }
      return m ? m + " мин " + s + " с" : s + " с";
    }
    async function loadSettings() {
      const res = await fetch("/api/settings");
      const s = await res.json();
      document.getElementById("kind").value = s.current_target_kind || "baron";
      document.getElementById("hotkey").value = s.hotkey || "N";
      document.getElementById("maxConcurrent").value = s.max_concurrent_attacks || 30;
      document.getElementById("delayMin").value = s.attack_delay_min || 4;
      document.getElementById("delayMax").value = s.attack_delay_max || 10;
      document.getElementById("dryRun").checked = !!s.dry_run;
      document.getElementById("feathers").checked = s.use_feathers !== false;
    }
    document.getElementById("toggle").onclick = async function () {
      await fetch("/api/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ toggle: true }),
      });
      tick();
    };
    document.getElementById("save").onclick = async function () {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          current_target_kind: document.getElementById("kind").value,
          hotkey: document.getElementById("hotkey").value,
          max_concurrent_attacks: Number(document.getElementById("maxConcurrent").value),
          attack_delay_min: Number(document.getElementById("delayMin").value),
          attack_delay_max: Number(document.getElementById("delayMax").value),
          dry_run: document.getElementById("dryRun").checked,
          use_feathers: document.getElementById("feathers").checked,
        }),
      });
    };
    async function tick() {
      const res = await fetch("/api/state");
      const data = await res.json();
      const on = data.enabled !== false && !data.paused;
      const btn = document.getElementById("toggle");
      btn.textContent = on ? "ВКЛ — ищет цели" : "ВЫКЛ — мышь свободна";
      btn.className = on ? "on" : "off";
      document.getElementById("hotkeyHint").textContent =
        "Клавиша " + (data.hotkey || "N") + " сразу отпускает мышь";
      const status = [];
      status.push(data.running ? (on ? "бот работает" : "на паузе") : "бот остановлен");
      if (data.dry_run) status.push("DRY-RUN");
      status.push(data.account || "аккаунт не выбран");
      status.push(data.mode || "idle");
      if (data.stopped_reason) status.push(data.stopped_reason);
      document.getElementById("status").textContent = status.join(" · ");
      document.getElementById("coords").textContent = data.last_coords || "—";
      document.getElementById("cd").textContent = fmt(data.next_attack_cd_sec);
      document.getElementById("inflight").textContent = data.in_flight || 0;
      const shot = document.getElementById("shot");
      if (data.last_screenshot) {
        shot.src = "/shots/" + data.last_screenshot.split(/[\\/]/).pop() + "?t=" + Date.now();
        shot.style.display = "block";
      } else {
        shot.style.display = "none";
      }
      const box = document.getElementById("marches");
      const rows = data.marches || [];
      if (!rows.length) {
        box.innerHTML = '<div class="muted">Свободных маршей нет</div>';
        return;
      }
      box.innerHTML = rows.map(function (m) {
        return (
          '<div class="march">' +
          "<b>№" + m.commander_no + "</b> · " + m.kind +
          " · K" + m.kingdom + " (" + m.x + ", " + m.y + ")<br>" +
          '<span class="ok">до цели ' + fmt(m.arrive_left_sec) + "</span> · " +
          '<span class="warn">возврат ' + fmt(m.return_left_sec) + "</span>" +
          "</div>"
        );
      }).join("");
    }
    loadSettings();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
